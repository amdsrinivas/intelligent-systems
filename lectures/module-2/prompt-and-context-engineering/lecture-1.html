<!doctype html>
<html lang=en data-theme=light>
<head>
<meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1.0"><title>Prompt Engineering — Basics of Prompting</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%3E%3Ctext%20x=%2250%22%20y=%2284%22%20text-anchor=%22middle%22%20fill=%22%231a1d23%22%20font-family=%22sans-serif%22%20font-size=%2282%22%20font-weight=%22700%22%3EIS%3C/text%3E%3C/svg%3E">
<link rel=preconnect href=https://fonts.googleapis.com><link rel=preconnect href=https://fonts.gstatic.com crossorigin><link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600;700&display=swap" rel=stylesheet>
<style>
:root{--bg:#e5e7eb;--card:#fff;--surface:#f6f7f9;--soft:#eef0f3;--text:#1a1d23;--muted:#5b6472;--border:#e3e6ea;--solid:#1a1d23;--solidtext:#fff;--font:"Source Code Pro",ui-monospace,monospace}[data-theme=dark]{--bg:#0f1115;--card:#0f1115;--surface:#171a21;--soft:#1f232c;--text:#e8eaed;--muted:#9aa3b2;--border:#2a2f3a;--solid:#e8eaed;--solidtext:#0f1115}*{box-sizing:border-box;margin:0}html,body{height:100%}body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}#deck{height:100vh}.slide{display:none;height:100vh;min-height:100vh;padding:clamp(4rem,8vh,6rem) clamp(2rem,8vw,9rem) 6rem;background:var(--card);overflow:auto}.slide.active{display:flex;flex-direction:column;justify-content:center}.content{width:min(100%,1100px);margin:auto}h1,h2,h3{line-height:1.15;letter-spacing:-.035em}h1{font-size:clamp(3rem,7vw,6.5rem)}h2{font-size:clamp(2rem,4vw,4rem);margin-bottom:1.5rem}h3{font-size:clamp(1.1rem,2vw,1.6rem)}p,li{font-size:clamp(1rem,1.55vw,1.35rem);line-height:1.55}.eyebrow{font-size:.9rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted);margin-bottom:1rem}.lead{font-size:clamp(1.2rem,2vw,1.8rem);color:var(--muted);margin-top:1.5rem;max-width:900px}.title{background:var(--solid);color:var(--solidtext)}.title .eyebrow,.title .lead{color:#c8cdd5}.section{background:var(--surface)}.mark{border:2px solid currentColor;border-radius:.75rem;display:grid;place-items:center;width:4rem;height:4rem;font-size:1.5rem;font-weight:700;margin-bottom:1.5rem}.grid2,.grid3{display:grid;gap:1.5rem}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:.75rem;padding:clamp(1rem,2vw,1.75rem)}.darkcard{background:var(--solid);color:var(--solidtext)}.label{color:var(--muted);font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem}.flow{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}.node{padding:1rem 1.35rem;background:var(--surface);border:1px solid var(--border);border-radius:.5rem;font-weight:700;text-align:center}.arrow{font-size:2rem;color:var(--muted)}.quote{border-left:.3rem solid var(--text);padding:1rem 1.5rem;background:var(--surface);border-radius:0 .5rem .5rem 0}.prompt{white-space:pre-wrap;background:var(--solid);color:var(--solidtext);padding:1.25rem 1.5rem;border-radius:.75rem;font-size:clamp(.85rem,1.4vw,1.15rem);line-height:1.6}.bullets{padding-left:1.3em;display:grid;gap:.6rem}.steps{display:grid;gap:1rem;counter-reset:step}.step{display:grid;grid-template-columns:2.3rem 1fr;gap:1rem}.step:before{counter-increment:step;content:counter(step);background:var(--solid);color:var(--solidtext);width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;font-weight:700}table{border-collapse:collapse;width:100%;font-size:clamp(.85rem,1.3vw,1.1rem)}th,td{border:1px solid var(--border);padding:.75em 1em;text-align:left;vertical-align:top}th{background:var(--soft)}img{display:block;max-width:100%;max-height:min(68vh,680px);margin:auto;object-fit:contain;border-radius:.5rem;box-shadow:0 12px 32px rgba(16,24,40,.14)}.caption{font-size:.9rem;color:var(--muted);text-align:center;margin-top:1rem}.callout{margin-top:1.5rem;padding:1rem 1.4rem;background:var(--soft);border-left:.3rem solid var(--text);border-radius:0 .5rem .5rem 0}.num{position:absolute;right:3rem;bottom:1.35rem;color:var(--muted);font-size:.85rem}.bar{position:fixed;top:0;left:0;height:4px;background:var(--solid);width:0;z-index:2}.controls{position:fixed;bottom:0;left:0;right:0;height:4.5rem;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;background:var(--card);border-top:1px solid var(--border);z-index:3}.buttons{display:flex;gap:.5rem}button{font:inherit;font-weight:700;border:1px solid var(--border);background:var(--card);color:var(--text);padding:.55rem .8rem;border-radius:.5rem;cursor:pointer}button:hover,button:focus{outline:2px solid var(--text);outline-offset:2px;background:var(--soft)}@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}.slide{padding-inline:1.5rem}.num{right:1.5rem}}@media print{body{overflow:visible}.slide{display:flex!important;min-height:100vh;page-break-after:always}.controls,.bar{display:none}}
</style>
</head>
<body><main id=deck></main><div id=bar class=bar></div><nav class=controls aria-label="Slide controls"><div class=buttons><button id=prev>← Prev</button><button id=next>Next →</button></div><span id=counter></span><div class=buttons><button id=full>Fullscreen</button></div></nav>
<script>
const slides=[
["title","<div class=mark>01</div><p class=eyebrow>Prompt Engineering · Lecture 1</p><h1>Basics of Prompting</h1><p class=lead>What prompts are, why they work, and how to improve them.</p>"],
["","<p class=eyebrow>LLM refresher</p><h2>Before getting into prompts</h2><div class=flow><div class=node>Foundation model</div><span class=arrow>→</span><div class=node>Post-training / fine-tuning<br><small>Tasks and exchanges</small></div><span class=arrow>→</span><div class=node>Usable LLM</div></div><div class=flow style=margin-top:2rem><div class=node>Sequence of input tokens</div><span class=arrow>→</span><div class=node>LLM</div><span class=arrow>→</span><div class=node>Sequence of output tokens</div></div>"],
["","<h2>From training to inference</h2><img src=assets/prompt-inference-infographic.jpg alt=Foundation-model-adaptation-and-inference-flow><p class=caption>The same usable model is applied at inference time.</p>"],
["","<p class=eyebrow>The input matters</p><h2>Why prompting?</h2><ul class=bullets><li>LLMs are trained to generate tokens useful for our tasks.</li><li>The sequence of input tokens that helps generate a desired output is called a <strong>prompt</strong>.</li><li>A prompt can include instructions, context, and input data.</li><li>Real applications may need enterprise terminology, internal knowledge, tool details, and output constraints.</li></ul>"],
["","<h2>Why the complicated definition?</h2><div class=steps><div class=step><p>We engineer the input to make outputs more accurate, efficient, and safe.</p></div><div class=step><p>Enterprise tasks may involve internal nomenclature, knowledge, and tools.</p></div><div class=step><p>Relevant information must be available in the input during inference.</p></div><div class=step><p>Models or APIs handle tokenization, but context limits and model-specific formats still matter.</p></div></div>"],
["","<p class=eyebrow>How generation starts</p><h2>Next-token prediction</h2><div class=quote><p>The largest planet in our solar system is</p></div><p style=margin:1.5rem> The model estimates a probability distribution for the next token.</p><table><tr><th>Candidate</th><th>Relative probability</th></tr><tr><td>Jupiter</td><td>High</td></tr><tr><td>Mars</td><td>Low</td></tr><tr><td>sandwich</td><td>Very low</td></tr></table><p class=lead>Then it selects or samples a token and repeats.</p>"],
["","<img src=assets/next-token-probability-diagram.jpg alt=Next-token-probability-distribution><p class=caption>Illustrative next-token probability distribution.</p>"],
["","<p class=eyebrow>One token at a time</p><h2>Generation is autoregressive</h2><pre class=prompt>Prompt → predict next token → append token → predict again → ...</pre><div class=quote style=margin-top:2rem><p>The largest planet in our solar system is <strong>Jupiter</strong>.</p></div><p class=lead>Each generated token becomes part of the context for the next one.</p>"],
["section","<p class=eyebrow>Working session · Basic prompting</p><h1>Run a simple prompt, then a structured prompt.</h1><p class=lead>Observe what changes in the model output.</p>"],
["section","<p class=eyebrow>Part 2</p><h1>Structured prompting</h1><p class=lead>Reduce ambiguity about the task, the information, and the expected answer.</p>"],
["","<h2>Main components</h2><table><tr><th>Component</th><th>Purpose</th></tr><tr><td>Instruction</td><td>What to do</td></tr><tr><td>Context</td><td>Information needed</td></tr><tr><td>Examples</td><td>Desired behavior</td></tr><tr><td>Constraints</td><td>Limits and rules</td></tr><tr><td>Output format</td><td>Shape of the response</td></tr><tr><td>Input data</td><td>Content to process</td></tr></table>"],
["","<h2>System prompt vs user prompt</h2><div class=grid2><div class=card><p class=label>System prompt</p><h3>Broad behavior</h3><p class=lead>Policies, role, and guardrails.</p></div><div class=card><p class=label>User prompt</p><h3>Task-specific request</h3><p class=lead>The current request and its content.</p></div></div><div class=callout><p>Both contribute to the context used for generation.</p></div>"],
["","<p class=eyebrow>Prompt evolution · version 1</p><h2>Start with a vague request</h2><div class=quote><p>Tell me about this product.</p></div><p style=margin:1.5rem>Questions left open:</p><ul class=bullets><li>Which product information is available?</li><li>Who is the audience?</li><li>How much detail?</li><li>What should the output look like?</li></ul>"],
["","<p class=eyebrow>Prompt evolution · version 2</p><h2>Add a clear instruction</h2><div class=quote><p>Explain this product to a first-time buyer in simple language.</p></div><div class=grid3 style=margin-top:2rem><div class=card><h3>Task</h3><p>Explains the product.</p></div><div class=card><h3>Audience</h3><p>A first-time buyer.</p></div><div class=card><h3>Style</h3><p>Simple language.</p></div></div>"],
["","<p class=eyebrow>Prompt evolution · version 3</p><h2>Add constraints</h2><pre class=prompt>Explain this product to a first-time buyer in simple language.\nUse five bullet points and mention the main benefit,\nlimitation, price, and ideal user.</pre><div class=grid3 style=margin-top:2rem><div class=card><h3>Coverage</h3><p>Required details.</p></div><div class=card><h3>Structure</h3><p>Five bullet points.</p></div><div class=card><h3>Comparison</h3><p>Easier to evaluate outputs.</p></div></div>"],
["","<p class=eyebrow>Prompt evolution · version 4</p><h2>Specify the output format</h2><pre class=prompt>Explain this product to a first-time buyer in simple language.\nReturn valid JSON with these keys: summary, benefits,\nlimitations, ideal_user.</pre><ul class=bullets style=margin-top:1.5rem><li>Supports more predictable, machine-readable output.</li><li>Makes missing fields easier to detect.</li><li>Use structured outputs or schema validation for strict guarantees when available.</li></ul>"],
["","<h2>Core principle</h2><div class=quote><p>Better prompts reduce ambiguity about:</p><ul class=bullets style=margin-top:1rem><li>the task</li><li>the information the model may use</li><li>the form of the answer</li></ul></div><p class=lead><strong>Not:</strong> Make the prompt as long as possible.</p>"],
["","<h2>A practical prompt template</h2><pre class=prompt>Task: [what to do]\nContext: [information to use]\nConstraints: [rules and limits]\nOutput format: [required response shape]\nInput: [content to process]</pre><p class=lead>Use only the components your task needs.</p>"],
["section","<p class=eyebrow>Working session</p><h1>Apply structured prompts</h1><p class=lead>Improve a basic prompt by adding an audience, required details, and output format.</p><div class=callout><p>What information did the basic prompt leave out?</p></div>"],
["section","<p class=eyebrow>Part 3</p><h1>In-context learning</h1><p class=lead>Use information and examples in the current input to guide a response.</p>"],
["","<h2>What is in-context learning?</h2><p class=lead style=color:var(--text)>The model uses information and examples <strong>inside the current prompt</strong> to adapt its response.</p><div class=grid3 style=margin-top:2rem><div class=card><h3>Inference time</h3><p>Happens while generating a response.</p></div><div class=card><h3>No weight updates</h3><p>Model parameters do not change.</p></div><div class=card><h3>Temporary</h3><p>Usually applies only to the current context.</p></div></div>"],
["","<p class=eyebrow>No examples</p><h2>Zero-shot prompting</h2><p class=lead>The model relies on the instruction and its prior training.</p><pre class=prompt>Classify the sentiment as positive, negative, or neutral:\nThe battery lasts all day, but the camera is average.</pre>"],
["","<p class=eyebrow>Examples first</p><h2>Few-shot prompting</h2><p style=margin-bottom:1rem>Examples demonstrate the task before the new input.</p><pre class=prompt>Review: Excellent battery life and a beautiful display.\nSentiment: Positive\n\nReview: The app crashes constantly.\nSentiment: Negative\n\nReview: The battery lasts all day, but the camera is average.\nSentiment:</pre>"],
["","<h2>What do examples communicate?</h2><div class=grid2><div class=card><ul class=bullets><li>The task</li><li>The label space</li><li>The output style</li></ul></div><div class=card><ul class=bullets><li>Expected detail</li><li>Edge-case handling</li><li>Examples are part of the specification.</li></ul></div></div>"],
["","<h2>Zero-shot vs few-shot</h2><table><tr><th>Zero-shot</th><th>Few-shot</th></tr><tr><td>No examples</td><td>Includes examples</td></tr><tr><td>Shorter prompt</td><td>Longer prompt</td></tr><tr><td>Relies on instruction and prior training</td><td>Demonstrates desired behavior</td></tr><tr><td>May vary on unusual formats</td><td>Often improves consistency</td></tr></table>"],
["","<img src=assets/fine-tuning-vs-in-context-learning.jpg alt=Fine-tuning-versus-in-context-learning><p class=caption>Fine-tuning changes model weights; in-context learning does not.</p>"],
["","<h2>Key takeaway</h2><div class=quote><p>Examples can teach the model how to respond <strong>for this interaction</strong>.</p></div><p class=lead>They do not retrain the model.</p>"],
["section","<p class=eyebrow>Working session</p><h1>Experiment with in-context learning</h1><p class=lead>Move from a basic prompt to output constraints and few-shot examples.</p>"],
["title","<p class=eyebrow>Recap</p><h1>Five ideas to retain</h1><div class=grid2 style=margin-top:2rem><div class=darkcard><p>A prompt is the input/context that guides model output.</p></div><div class=darkcard><p>LLMs generate by predicting one token at a time.</p></div><div class=darkcard><p>Structure reduces ambiguity about task, context, and output.</p></div><div class=darkcard><p>Examples guide the current interaction; they do not retrain the model.</p></div><div class=darkcard><p>Prompt quality should be tested with representative inputs.</p></div></div>"]
];
const deck=document.getElementById("deck"),counter=document.getElementById("counter"),bar=document.getElementById("bar");let current=0;slides.forEach(slide=>{const node=document.createElement("section");node.className="slide "+slide[0];node.innerHTML="<div class=content>"+slide[1]+"</div><span class=num></span>";deck.appendChild(node)});const nodes=Array.from(document.querySelectorAll(".slide"));function show(index){current=Math.max(0,Math.min(index,nodes.length-1));nodes.forEach((node,i)=>node.classList.toggle("active",i===current));document.querySelectorAll(".num").forEach(node=>node.textContent=(current+1)+" / "+nodes.length);counter.textContent=(current+1)+" / "+nodes.length;bar.style.width=((current+1)/nodes.length*100)+"%"}document.getElementById("next").onclick=()=>show(current+1);document.getElementById("prev").onclick=()=>show(current-1);document.getElementById("full").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.onkeydown=e=>{if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();show(current+1)}if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==="Home")show(0);if(e.key==="End")show(nodes.length-1);if(e.key.toLowerCase()==="f")document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};show(0);
</script></body></html>
